# Publishes the solo version of the game to GitHub Pages on every push to main.
# Players open https://<your-username>.github.io/perfect-circle/
# This version has no PC server: sign-in, online duels and the leaderboard are hidden,
# and each player's progress is saved on their own device.
name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test                # never publish a version whose tests fail
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_NO_SERVER: '1'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
