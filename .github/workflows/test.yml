# Runs the unit tests and the end-to-end tests on every push (step 16).
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04   # pinned: Playwright supports it; ubuntu-latest moves to Ubuntu 26 in Oct 2026
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run coverage        # 48 unit tests + coverage report
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
